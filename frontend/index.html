<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat con Agente IA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="chat-container">
    <header class="chat-header">
      <div class="status-dot"></div>
      <div>
        <h1>Chat con Agente IA</h1>
        <p>Asistente conectado a OpenRouter</p>
      </div>
    </header>

    <section id="chatBox" class="chat-box" aria-live="polite">
      <div class="message assistant">¡Hola! Escribe un mensaje para comenzar.</div>
    </section>

    <form id="chatForm" class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
        aria-label="Escribe tu mensaje"
        required
      >
      <button id="sendButton" type="submit">Enviar</button>
    </form>
    <p class="footnote">Tus mensajes se procesan mediante el backend del proyecto.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
